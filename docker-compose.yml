# Development database only; production deploys use the helm chart in the 3.4 repo.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codecafe
      POSTGRES_PASSWORD: codecafe
      POSTGRES_DB: codecafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
