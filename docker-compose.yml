# Local development database only. This file is not a production deployment definition.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codecafe
      POSTGRES_PASSWORD: codecafe
      POSTGRES_DB: codecafe
    ports:
      - "127.0.0.1:${CODECAFE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
