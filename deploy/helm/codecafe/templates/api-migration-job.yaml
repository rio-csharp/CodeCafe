{{- if .Values.api.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "codecafe.fullname" . }}-api-migrate
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.api.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.api.migration.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.api.migration.activeDeadlineSeconds | default 600 }}
  template:
    metadata:
      labels:
        {{- include "codecafe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-migrate
          image: "{{ required "api.image.repository is required" .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Only the connection string is needed: the migrate verb builds the host,
          # applies migrations and returns before the HTTP server starts, so none of
          # the Ai/Mcp/Cors configuration is read.
          {{- with .Values.api.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          command:
            - dotnet
            - CodeCafe.Host.dll
            - migrate
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
