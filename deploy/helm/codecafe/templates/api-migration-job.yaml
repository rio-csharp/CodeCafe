{{- if .Values.api.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "codecafe.fullname" . }}-api-migrate
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.api.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.api.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "codecafe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-migrate
          image: "{{ required "api.image.repository is required" .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          command:
            - dotnet
            - CodeCafe.Server.dll
            - migrate
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
