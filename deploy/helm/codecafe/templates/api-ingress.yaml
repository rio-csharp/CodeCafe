{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "codecafe.fullname" . }}-api
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ingressClassName: {{ .Values.api.ingress.className | quote }}
  {{- if .Values.api.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.api.ingress.host | quote }}
      secretName: {{ .Values.api.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "codecafe.fullname" . }}-api
                port:
                  name: http
{{- end }}
