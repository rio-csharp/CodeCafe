apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codecafe.fullname" . }}-api
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.api.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.api.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "codecafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "codecafe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      # The app never calls the Kubernetes API — don't mount a SA token.
      automountServiceAccountToken: false
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ required "api.image.repository is required" .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: Auth__RegistrationEnabled
              value: {{ .Values.api.auth.registrationEnabled | quote }}
            - name: ForwardedHeaders__ForwardLimit
              value: {{ .Values.api.forwardedHeaders.forwardLimit | quote }}
            {{- range $index, $network := .Values.api.forwardedHeaders.knownNetworks }}
            - name: ForwardedHeaders__KnownNetworks__{{ $index }}
              value: {{ $network | quote }}
            {{- end }}
            - name: Shutdown__TimeoutSeconds
              value: {{ max 1 (sub .Values.api.terminationGracePeriodSeconds .Values.api.preStopSleepSeconds) | quote }}
            {{- if .Values.api.ai.apiKeySecretName }}
            - name: Ai__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.ai.apiKeySecretName | quote }}
                  key: {{ .Values.api.ai.apiKeySecretKey | quote }}
            {{- end }}
            - name: Ai__Enabled
              value: {{ .Values.api.ai.enabled | quote }}
            - name: Ai__EndpointPath
              value: {{ .Values.api.ai.endpointPath | quote }}
            - name: Ai__StatusEndpointPath
              value: {{ .Values.api.ai.statusEndpointPath | quote }}
            - name: Ai__EditEndpointPath
              value: {{ .Values.api.ai.editEndpointPath | quote }}
            - name: Ai__DraftEndpointPath
              value: {{ .Values.api.ai.draftEndpointPath | quote }}
            - name: Ai__AgentName
              value: {{ .Values.api.ai.agentName | quote }}
            - name: Ai__Model
              value: {{ .Values.api.ai.model | quote }}
            - name: Ai__BaseUrl
              value: {{ .Values.api.ai.baseUrl | quote }}
            - name: Ai__WireFormat
              value: {{ .Values.api.ai.wireFormat | quote }}
            - name: Ai__MaxToolResults
              value: {{ .Values.api.ai.maxToolResults | quote }}
            - name: Ai__MaxToolContentChars
              value: {{ .Values.api.ai.maxToolContentChars | quote }}
            - name: Ai__MaxDraftPromptChars
              value: {{ .Values.api.ai.maxDraftPromptChars | quote }}
            - name: Ai__MaxDraftContextChars
              value: {{ .Values.api.ai.maxDraftContextChars | quote }}
            - name: Ai__MaxDraftOutputTokens
              value: {{ .Values.api.ai.maxDraftOutputTokens | quote }}
            - name: Mcp__Enabled
              value: {{ .Values.api.mcp.enabled | quote }}
            {{- range $index, $origin := .Values.api.mcp.allowedOrigins }}
            - name: Mcp__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            {{- range $index, $origin := .Values.api.cors.allowedOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -USR1 1 || true; sleep {{ .Values.api.preStopSleepSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.api.ingress.host | quote }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.api.ingress.host | quote }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
