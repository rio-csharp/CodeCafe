# PDBs are only rendered with more than one replica; with replicaCount: 1 a
# minAvailable: 1 PDB would block node drains indefinitely.
{{- if and .Values.api.pdb.enabled (gt (int .Values.api.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "codecafe.fullname" . }}-api
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "codecafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
---
{{- if and .Values.frontend.pdb.enabled (gt (int .Values.frontend.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "codecafe.fullname" . }}-frontend
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "codecafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
{{- end }}
