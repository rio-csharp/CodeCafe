{{- /*
The browser-facing API origin is runtime configuration, not a build input: one
image serves every environment. It ships as a ConfigMap mounted over the image's
default /config.js, so the frontend root filesystem can stay read-only (the 3.x
chart wrote the file at start-up instead).
*/}}
{{- if .Values.frontend.config.apiBaseUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codecafe.fullname" . }}-frontend-config
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  config.js: |
    window.__CODECAFE_CONFIG__ = {
      apiBaseUrl: {{ .Values.frontend.config.apiBaseUrl | quote }}
    };
{{- end }}
