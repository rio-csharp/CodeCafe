apiVersion: v1
kind: Service
metadata:
  name: {{ include "codecafe.fullname" . }}-api
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "codecafe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
# Release-independent alias the frontend nginx proxies /api to, so the frontend
# image needs no per-environment configuration. A namespace hosts exactly one
# CodeCafe release, so this name cannot collide.
apiVersion: v1
kind: Service
metadata:
  name: {{ required "api.serviceAliasName is required: the frontend nginx proxies /api to it" .Values.api.serviceAliasName }}
  labels:
    {{- include "codecafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: codecafe
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "codecafe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
