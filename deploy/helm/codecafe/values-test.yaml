frontend:
  replicaCount: 1

api:
  replicaCount: 1
  # NOTE: scripts/cd/deploy-helm.sh always overrides api.envFromSecrets[0]
  # with the generated <release>-api-config secret, so this entry only takes
  # effect for bare `helm install/template -f values-test.yaml` runs (e.g. CI
  # chart validation), not for scripted deployments.
  envFromSecrets:
    - codecafe-db-secret
  forwardedHeaders:
    # The k3s pod CIDR. Traefik terminates TLS and sets X-Forwarded-Proto from
    # a pod IP in this range; without trusting it the API sees plain HTTP and
    # antiforgery (Cookie.SecurePolicy=Always) fails every request with 500.
    knownNetworks:
      - "10.42.0.0/16"
