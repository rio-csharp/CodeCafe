nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # readOnlyRootFilesystem stays true even though the deployment injects runtime
  # configuration: the API origin arrives as a ConfigMap mounted over the
  # image's default /config.js, so nothing writes under the html root at start-up.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/example/codecafe/frontend
    tag: "" # required at deploy time; the chart fails without an explicit immutable tag
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  config:
    # Browser-facing API origin written to /config.js. Empty means same-origin,
    # which is only useful with the image's own /api fallback. deploy-helm.sh
    # always sets it to https://$API_HOST so the SPA calls the API host directly.
    apiBaseUrl: ""
  probes:
    readiness:
      path: /
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    host: frontend.example.local
    tls:
      enabled: true
      secretName: codecafe-frontend-tls
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

api:
  replicaCount: 2
  auth:
    # Self-service sign-up. Off in the chart so that a bare `helm install` matches the
    # application default; deploy-helm.sh maps the REGISTRATION_ENABLED repository
    # variable onto it, which is how an environment opts in.
    registrationEnabled: false
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/example/codecafe/api
    tag: "" # required at deploy time; the chart fails without an explicit immutable tag
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  # The frontend nginx resolves its upstream by this release-independent name
  # (see clients/web/nginx.conf), which is why a namespace must hold exactly one
  # CodeCafe release — it does: one per environment, one per PR preview.
  serviceAliasName: codecafe-api
  envFromSecrets: []
  # Kubernetes migrates through the pre-upgrade Job below, so the replicas must
  # not migrate too: two pods calling MigrateAsync at once race. Leave false on
  # Kubernetes; true is only for a single-replica install that has
  # migration.enabled=false.
  migrateOnStartup: false
  migration:
    enabled: true
    backoffLimit: 1
    ttlSecondsAfterFinished: 300
    activeDeadlineSeconds: 600
  # Empty leaves the image's AllowedHosts default in place. The deploy script
  # sets "<frontend host>;<api host>": the browser-facing host is needed because
  # the frontend nginx forwards the original Host header, and the API host for
  # direct traffic.
  allowedHosts: ""
  forwardedHeaders:
    # Single-proxy topology: exactly one forwarding hop is trusted.
    forwardLimit: 1
    # CIDR ranges whose X-Forwarded-For headers are trusted (the egress networks
    # of the ingress controller in front of the API). Empty means the server
    # default (loopback only), which ignores client-supplied X-Forwarded-For and
    # keeps IP-partitioned rate limits spoof-proof — but then nothing the ingress
    # sets is believed either, so every anonymous request shares one bucket.
    # Assumed k3s default pod CIDR. VERIFY on the target cluster before the first
    # deploy (kubectl get pods -A -o wide): if the ingress pods live in a
    # different range, update this value.
    knownNetworks:
      - "10.42.0.0/16"
  ai:
    enabled: false
    model: ""
    baseUrl: ""
    wireFormat: OpenAiChatCompletions # OpenAiChatCompletions or OpenAiResponses
    relay: Generic
    apiKeySecretName: ""
    apiKeySecretKey: "Ai__ApiKey"
    maxOutputTokens: 16384
    maxHistoryChars: 400000
    maxOutlineChars: 24000
    maxToolResultChars: 24000
    maxToolIterations: 16
    maxProviderRetries: 5
    providerRetryBaseDelayMs: 1000
  mcp:
    enabled: true
    endpointPath: /mcp
  cors:
    allowedOrigins:
      - https://frontend.example.local
  probes:
    readiness:
      path: /health/ready
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    host: api.example.local
    tls:
      enabled: true
      secretName: codecafe-api-tls
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
