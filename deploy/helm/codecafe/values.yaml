nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/example/codecafe/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  env:
    apiBaseUrl: http://localhost:5000
  ingress:
    enabled: true
    className: traefik
    host: frontend.example.local
    tls:
      enabled: true
      secretName: codecafe-frontend-tls
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

api:
  replicaCount: 1
  image:
    repository: ghcr.io/example/codecafe/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  cors:
    allowedOrigins:
      - https://frontend.example.local
  ingress:
    enabled: true
    className: traefik
    host: api.example.local
    tls:
      enabled: true
      secretName: codecafe-api-tls
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
