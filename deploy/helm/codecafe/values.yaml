nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # NOTE: readOnlyRootFilesystem stays false — the container entrypoint
  # writes config.js and patches index.html under the html root at startup.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/example/codecafe/frontend
    tag: "" # required at deploy time; the chart fails without an explicit immutable tag
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  env:
    apiBaseUrl: https://api.example.local
    aiStatusEndpointPath: /api/ai/status
  probes:
    readiness:
      path: /
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    host: frontend.example.local
    tls:
      enabled: true
      secretName: codecafe-frontend-tls
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

api:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/example/codecafe/api
    tag: "" # required at deploy time; the chart fails without an explicit immutable tag
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  envFromSecrets: []
  migration:
    enabled: true
    backoffLimit: 1
    ttlSecondsAfterFinished: 300
  auth:
    # Open user registration is disabled by default. Enable only for
    # deployments that should accept self-service sign-ups.
    registrationEnabled: false
  forwardedHeaders:
    # Single-proxy topology: exactly one forwarding hop is trusted.
    forwardLimit: 1
    # CIDR ranges whose X-Forwarded-For headers are trusted (the egress
    # networks of the reverse proxy / ingress controller in front of the API).
    # Empty means the server default (loopback only), which ignores
    # client-supplied X-Forwarded-For and keeps IP-partitioned rate limits
    # spoof-proof. Set your ingress pod/node CIDRs in real deployments.
    knownNetworks: []
  ai:
    enabled: false
    endpointPath: /api/ai/assistant
    statusEndpointPath: /api/ai/status
    editEndpointPath: /api/ai/edits
    draftEndpointPath: /api/ai/drafts
    agentName: CodeCafeAssistant
    model: ""
    baseUrl: ""
    wireFormat: ChatCompletions # ChatCompletions or Responses
    apiKeySecretName: ""
    apiKeySecretKey: "Ai__ApiKey"
    maxToolResults: 10
    maxToolContentChars: 4000
    maxDraftPromptChars: 2000
    maxDraftContextChars: 200000
    maxDraftOutputTokens: 1600
  mcp:
    enabled: true
    # Absolute HTTP/HTTPS origins allowed to call the MCP endpoint cross-origin.
    allowedOrigins: []
  cors:
    allowedOrigins:
      - https://frontend.example.local
  probes:
    readiness:
      path: /health/ready
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    host: api.example.local
    tls:
      enabled: true
      secretName: codecafe-api-tls
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
