# Shared security headers for every location block.
# NOTE: nginx add_header is NOT inherited by a location that defines its own
# add_header (e.g. Cache-Control), so this file must be included in each one.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The SPA renders user-generated notebook content (sanitized) — CSP is the
# last line of defense against sanitizer bypasses. 'unsafe-inline' style is
# required for TipTap inline styles (text-align, font-family, colors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
