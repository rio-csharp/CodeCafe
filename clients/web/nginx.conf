server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1k;

    # NOTE: nginx add_header is NOT inherited by a block that defines its own
    # add_header, so the shared security headers are included in every block.

    # Runtime config (no cache)
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Hashed assets under /assets/ (immutable, 1 year)
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Other static files (public/, non-hashed): short cache, revalidate
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # SPA fallback
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
