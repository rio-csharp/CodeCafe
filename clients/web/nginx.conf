# Two origins, on purpose: the SPA is served from the frontend host and sends
# its /api/... calls to the API host named by the runtime config mounted at
# /config.js. A single-origin setup was the earlier 4.0 default; the split of
# the 3.x deployments is what the infrastructure wants.
#
# The /api/ proxy below stays as a same-origin fallback for an image started
# without that config (bare docker run, helm template). Deployed environments
# never exercise it.

# Preserve an inbound X-Forwarded-Proto so the API's forwarded-headers middleware
# still sees the client's scheme; fall back to this hop's scheme when the request
# never passed through the ingress (port-forward).
map $http_x_forwarded_proto $codecafe_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1k;

    # NOTE: nginx add_header is NOT inherited by a block that defines its own
    # add_header, so the shared security headers are included in every block.

    # Same-origin fallback only; the browser normally goes straight to the API
    # host. The upstream name is release-independent on purpose: a namespace
    # hosts exactly one CodeCafe release (see api.serviceAliasName in the Helm
    # chart, which creates the matching Service).
    location /api/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";

        proxy_pass http://codecafe-api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $codecafe_forwarded_proto;
        proxy_set_header Connection "";

        # The AI chat endpoint is Server-Sent Events. Buffering would hold every
        # frame until the response completes, which for a stream is never.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Runtime configuration, served from the ConfigMap mount (or the image default).
    # The exact match outranks the static-file regex below, which would otherwise
    # give it a cacheable max-age — a stale config.js points the SPA at the wrong
    # API origin, and Cloudflare caches .js at the edge by default.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Hashed assets under /assets/ (immutable, 1 year)
    # ^~ so this prefix wins over the regex block below (regex locations
    # otherwise take precedence and would shadow the immutable rule).
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Other static files (public/, non-hashed): short cache, revalidate
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # SPA fallback
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
