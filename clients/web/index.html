<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeCafe — public notebooks, freshly brewed." />
    <title>CodeCafe</title>
    <script>
      // Applies the stored theme before first paint; the module bundle would be
      // too late and cause a flash. Dependency-free and silent on failure.
      ;(function () {
        try {
          var stored = localStorage.getItem('codecafe.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* storage or matchMedia unavailable: stay light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
