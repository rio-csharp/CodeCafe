<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeCafe — public notebooks, freshly brewed." />
    <title>CodeCafe</title>
    <!-- Classic, same-origin, and synchronous: applies the stored theme before first paint.
         External rather than inline so the deployed CSP needs no script hash or 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime configuration, shadowed by a ConfigMap at deploy time. Classic
         (not module) so it runs before the deferred bundle reads it. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
