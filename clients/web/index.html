<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>CodeCafe</title>
    <script>
      // Apply the persisted theme before first paint to avoid a white flash
      // for dark-mode users. Must stay in sync with the zustand persist key
      // and storage format in src/shared/model/themeStore.ts.
      (function () {
        try {
          var stored = localStorage.getItem('codecafe-theme')
          var theme = stored ? JSON.parse(stored).state.theme : 'system'
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || theme == null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          // Corrupt storage or unavailable APIs: fall back to light/system.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
