name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run id that produced artifacts.
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE: codecafe-prod
  RELEASE: codecafe-prod
  TLS_SECRET: codecafe-production-wildcard-tls

jobs:
  deploy:
    name: Deploy production environment
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve CI run
        id: ci
        uses: actions/github-script@v9
        env:
          DEPLOY_NAME: production
          DEPLOY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          DEPLOY_REQUIRED_WORKFLOW_NAME: CI
          DEPLOY_ALLOWED_BRANCHES: main
        with:
          script: |
            const resolveDeployCiRun = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/resolve-deploy-ci-run.js`);
            await resolveDeployCiRun({ github, context, core });

      - name: Download CI artifacts
        if: steps.ci.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/helm .artifacts/deployment .artifacts/scripts
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-cd-scripts --dir .artifacts/scripts
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-helm-chart --dir .artifacts/helm
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-deployment --dir .artifacts/deployment

      - name: Set image tag
        if: steps.ci.outputs.skip != 'true'
        run: bash .artifacts/scripts/set-image-tag-env.sh

      - name: Prepare OAuth secret payload
        if: steps.ci.outputs.skip != 'true'
        env:
          OAUTH_CERT_BASE64: ${{ secrets.OAUTH_CERT_BASE64 }}
          OAUTH_CERT_PASSWORD: ${{ secrets.OAUTH_CERT_PASSWORD }}
        run: bash .artifacts/scripts/write-oauth-env.sh

      - name: Configure SSH
        if: steps.ci.outputs.skip != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        if: steps.ci.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy production environment
        if: steps.ci.outputs.skip != 'true'
        env:
          DEPLOY_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          FRONTEND_HOST: ${{ vars.PRODUCTION_FRONTEND_HOST }}
          API_HOST: ${{ vars.PRODUCTION_API_HOST }}
          DB_SECRET_NAMESPACE: ${{ env.NAMESPACE }}
          KUBECTL_BIN: sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl
          HELM_BIN: sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/helm
          AI_ENABLED: 'true'
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: bash .artifacts/scripts/deploy-environment.sh
