name: Dispatch PR CI

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to dispatch CI for.
        required: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch CI for PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr_json="$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json number,headRefName,isDraft,state)"
            pr_number="$(echo "$pr_json" | jq -r '.number')"
            ref_name="$(echo "$pr_json" | jq -r '.headRefName')"
            is_draft="$(echo "$pr_json" | jq -r '.isDraft')"
            state="$(echo "$pr_json" | jq -r '.state')"
          else
            pr_number="${{ github.event.pull_request.number }}"
            ref_name="${{ github.event.pull_request.head.ref }}"
            is_draft="${{ github.event.pull_request.draft }}"
            state="${{ github.event.pull_request.state }}"
          fi

          if [ "$state" != "OPEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Trigger CI workflow
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.pr.outputs.ref_name }}"
