name: Release E2E

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  release-e2e:
    name: Release E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codecafe
          POSTGRES_PASSWORD: codecafe
          POSTGRES_DB: codecafe_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Publish API
        run: >
          dotnet publish server/src/CodeCafe.Host/CodeCafe.Host.csproj
          --configuration Release
          --output .artifacts/api
          /p:UseAppHost=false

      - name: Install frontend dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: clients/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bash scripts/github/run-release-e2e.sh

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-diagnostics
          path: |
            .artifacts/e2e/backend.log
            clients/web/playwright-report/
          if-no-files-found: ignore
