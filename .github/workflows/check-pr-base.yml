name: Check PR base branch freshness

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  check-freshness:
    name: Check PR base freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if PR branch is based on latest target
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/github/check-pr-base-freshness.sh
