name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  artifact-policy:
    name: Decide artifact policy
    runs-on: ubuntu-latest
    outputs:
      upload_artifacts: ${{ steps.artifacts.outputs.upload_artifacts }}
      image_tag: ${{ steps.artifacts.outputs.image_tag }}
    steps:
      - name: Decide artifact policy
        id: artifacts
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          upload_artifacts=false

          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$BASE_REF" == release/* ]] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            upload_artifacts=true
          fi

          if [ "$EVENT_NAME" = "push" ] && { [ "$REF_NAME" = "main" ] || [[ "$REF_NAME" == release/* ]]; }; then
            upload_artifacts=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            upload_artifacts=true
          fi

          short_sha="${GITHUB_SHA::7}"
          image_tag="manual-$short_sha"

          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$BASE_REF" == release/* ]] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            image_tag="pr-$PR_NUMBER-$short_sha"
          fi

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == release/* ]]; then
            image_tag="test-$short_sha"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            image_tag="production-$short_sha"
          fi

          echo "upload_artifacts=$upload_artifacts" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore CodeCafe.slnx

      - name: Build backend
        run: dotnet build CodeCafe.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test CodeCafe.slnx --configuration Release --no-build

      - name: Publish API artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        run: >
          dotnet publish src/CodeCafe.WebApi/CodeCafe.WebApi.csproj
          --configuration Release
          --output .artifacts/api
          --no-build
          /p:UseAppHost=false

      - name: Upload API artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-api
          path: .artifacts/api
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "No frontend test script configured; skipping."
          fi

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-frontend
          path: frontend/dist
          if-no-files-found: error

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload Helm chart artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-helm-chart
          path: deploy/helm/codecafe
          if-no-files-found: error

  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload CI scripts artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-ci-scripts
          path: scripts/ci
          if-no-files-found: error

  publish-api-image:
    name: Publish API image
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - backend
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: codecafe-api
          path: .artifacts/api

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/CodeCafe.WebApi/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/api:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-api
          cache-to: type=gha,mode=max,scope=codecafe-api

  publish-frontend-image:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - frontend
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: codecafe-frontend
          path: .artifacts/frontend

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/frontend:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-frontend
          cache-to: type=gha,mode=max,scope=codecafe-frontend

  deployment-metadata:
    name: Deployment metadata
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - publish-api-image
      - publish-frontend-image
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Write deployment metadata
        run: |
          mkdir -p .artifacts/deployment
          {
            echo "IMAGE_TAG=${{ needs.artifact-policy.outputs.image_tag }}"
            echo "GIT_SHA=${{ github.sha }}"
            echo "GIT_REF=${{ github.ref_name }}"
          } > .artifacts/deployment/deployment.env

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-deployment
          path: .artifacts/deployment/deployment.env
          if-no-files-found: error
