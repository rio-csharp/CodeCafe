name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  artifact-policy:
    name: Decide artifact policy
    runs-on: ubuntu-latest
    outputs:
      upload_artifacts: ${{ steps.artifacts.outputs.upload_artifacts }}
      image_tag: ${{ steps.artifacts.outputs.image_tag }}
    steps:
      - name: Decide artifact policy
        id: artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          upload_artifacts=false
          pr_number=""
          owner="${REPOSITORY%%/*}"
          short_sha="${GITHUB_SHA::7}"
          image_tag="manual-$short_sha"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            upload_artifacts=true
            image_tag="production-$short_sha"
          fi

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == release/* ]]; then
            upload_artifacts=true
            image_tag="test-$short_sha"
          fi

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == feature/* ]]; then
            pr_number="$(gh api "repos/$REPOSITORY/pulls?state=open&head=$owner:$REF_NAME" \
              --jq 'map(select(.base.ref | startswith("release/")))[0].number // ""')"
            if [ -n "$pr_number" ]; then
              upload_artifacts=true
              image_tag="pr-$pr_number-$short_sha"
            fi
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ] && [ "$IS_FORK" != "true" ]; then
            upload_artifacts=true
            image_tag="pr-$PR_NUMBER-$short_sha"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            upload_artifacts=true
          fi

          echo "upload_artifacts=$upload_artifacts" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore CodeCafe.slnx

      - name: Build backend
        run: dotnet build CodeCafe.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test CodeCafe.slnx --configuration Release --no-build

      - name: Publish API artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        run: >
          dotnet publish src/CodeCafe.Server/CodeCafe.Server.csproj
          --configuration Release
          --output .artifacts/api
          --no-build
          /p:UseAppHost=false

      - name: Upload API artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-api
          path: .artifacts/api
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "No frontend test script configured; skipping."
          fi

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-frontend
          path: frontend/dist
          if-no-files-found: error

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codecafe
          POSTGRES_PASSWORD: codecafe
          POSTGRES_DB: codecafe_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: codecafe-api
          path: .artifacts/api

      - name: Start backend
        run: |
          ConnectionStrings__DefaultConnection="Host=localhost;Database=codecafe_e2e;Username=codecafe;Password=codecafe" \
          ASPNETCORE_URLS="http://localhost:5042" \
          ASPNETCORE_ENVIRONMENT="Development" \
          .artifacts/api/CodeCafe.Server &
          for i in {1..30}; do
            if curl -sf http://localhost:5042/health/live >/dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 4
          done

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload Helm chart artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-helm-chart
          path: deploy/helm/codecafe
          if-no-files-found: error

  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload CI scripts artifact
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-ci-scripts
          path: scripts/ci
          if-no-files-found: error

  publish-api-image:
    name: Publish API image
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - backend
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: codecafe-api
          path: .artifacts/api

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/CodeCafe.Server/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/api:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-api
          cache-to: type=gha,mode=max,scope=codecafe-api

  publish-frontend-image:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - frontend
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: codecafe-frontend
          path: .artifacts/frontend

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/frontend:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-frontend
          cache-to: type=gha,mode=max,scope=codecafe-frontend

  deployment-metadata:
    name: Deployment metadata
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - publish-api-image
      - publish-frontend-image
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Write deployment metadata
        run: |
          mkdir -p .artifacts/deployment
          {
            echo "IMAGE_TAG=${{ needs.artifact-policy.outputs.image_tag }}"
            echo "GIT_SHA=${{ github.sha }}"
            echo "GIT_REF=${{ github.ref_name }}"
          } > .artifacts/deployment/deployment.env

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-deployment
          path: .artifacts/deployment/deployment.env
          if-no-files-found: error
