name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  artifact-policy:
    name: Decide artifact policy
    runs-on: ubuntu-latest
    outputs:
      upload_artifacts: ${{ steps.artifacts.outputs.upload_artifacts }}
      image_tag: ${{ steps.artifacts.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide artifact policy
        id: artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash scripts/ci/decide-artifact-policy.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore server/CodeCafe.slnx

      - name: Build backend
        run: dotnet build server/CodeCafe.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test server/CodeCafe.slnx --configuration Release --no-build

      - name: Publish API image input
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        run: >
          dotnet publish server/Host/CodeCafe.Server/CodeCafe.Server.csproj
          --configuration Release
          --output .artifacts/api
          --no-build
          /p:UseAppHost=false

      - name: Login to GHCR
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Host/CodeCafe.Server/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/api:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-api
          cache-to: type=gha,mode=max,scope=codecafe-api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: clients/web
        run: npm ci

      - name: Test frontend
        working-directory: clients/web
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "No frontend test script configured; skipping."
          fi

      - name: Lint frontend
        working-directory: clients/web
        run: npm run lint

      - name: Build frontend
        working-directory: clients/web
        run: npm run build

      - name: Prepare frontend image input
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        working-directory: clients/web
        run: |
          mkdir -p ../../.artifacts/frontend
          cp -R dist/. ../../.artifacts/frontend/

      - name: Login to GHCR
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        if: needs.artifact-policy.outputs.upload_artifacts == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: clients/web/Dockerfile
          push: true
          tags: ghcr.io/${{ vars.IMAGE_NAMESPACE }}/frontend:${{ needs.artifact-policy.outputs.image_tag }}
          cache-from: type=gha,scope=codecafe-frontend
          cache-to: type=gha,mode=max,scope=codecafe-frontend

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/codecafe
          helm template codecafe deploy/helm/codecafe
          helm template codecafe-test deploy/helm/codecafe --values deploy/helm/codecafe/values-test.yaml
          helm template codecafe-prod deploy/helm/codecafe --values deploy/helm/codecafe/values-prod.yaml

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-helm-chart
          path: deploy/helm/codecafe
          if-no-files-found: error

  cd-scripts:
    name: CD scripts
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate CD scripts
        run: |
          bash -n scripts/cd/delete-stale-pr-preview.sh
          bash -n scripts/cd/deploy-environment.sh
          bash -n scripts/cd/deploy-helm.sh
          bash -n scripts/cd/rollback-environment.sh
          bash -n scripts/cd/rollback-helm-release.sh
          bash -n scripts/cd/set-image-tag-env.sh
          bash -n scripts/cd/smoke-test-release.sh
          bash -n scripts/cd/write-oauth-env.sh

      - name: Upload CD scripts artifact
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-cd-scripts
          path: |
            scripts/cd/delete-stale-pr-preview.sh
            scripts/cd/deploy-environment.sh
            scripts/cd/deploy-helm.sh
            scripts/cd/rollback-environment.sh
            scripts/cd/rollback-helm-release.sh
            scripts/cd/set-image-tag-env.sh
            scripts/cd/smoke-test-release.sh
            scripts/cd/write-oauth-env.sh
          if-no-files-found: error

  deployment-metadata:
    name: Deployment metadata
    runs-on: ubuntu-latest
    needs:
      - artifact-policy
      - backend
      - frontend
    if: needs.artifact-policy.outputs.upload_artifacts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write deployment metadata
        env:
          IMAGE_TAG: ${{ needs.artifact-policy.outputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: bash scripts/ci/write-deployment-metadata.sh

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v7
        with:
          name: codecafe-deployment
          path: .artifacts/deployment/deployment.env
          if-no-files-found: error
