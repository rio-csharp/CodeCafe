name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional Helm revision to roll back to. Leave empty to roll back one revision.
        required: false
        default: ""

permissions:
  contents: read

env:
  NAMESPACE: codecafe-prod
  RELEASE: codecafe-prod

jobs:
  rollback:
    name: Rollback production environment
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Roll back Helm release
        run: |
          ssh -p "${{ vars.PRODUCTION_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ vars.PRODUCTION_SSH_USER }}@${{ vars.PRODUCTION_SSH_HOST }}" \
            "NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' REVISION='${{ inputs.revision }}' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
          HELM="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/helm"
          KUBECTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl"

          $HELM history "$RELEASE" --namespace "$NAMESPACE"
          if [ -n "$REVISION" ]; then
            $HELM rollback "$RELEASE" "$REVISION" --namespace "$NAMESPACE" --wait --timeout 180s
          else
            $HELM rollback "$RELEASE" --namespace "$NAMESPACE" --wait --timeout 180s
          fi
          $KUBECTL rollout status deployment --selector app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=frontend --namespace "$NAMESPACE" --timeout=180s
          $KUBECTL rollout status deployment --selector app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=api --namespace "$NAMESPACE" --timeout=180s
          $HELM history "$RELEASE" --namespace "$NAMESPACE"
          REMOTE

      - name: Smoke test
        run: |
          ssh -p "${{ vars.PRODUCTION_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ vars.PRODUCTION_SSH_USER }}@${{ vars.PRODUCTION_SSH_HOST }}" \
            "NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
          KUBECTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl"

          frontend_port=18080
          api_port=18081

          $KUBECTL port-forward "service/${RELEASE}-frontend" "${frontend_port}:80" --namespace "$NAMESPACE" >/tmp/codecafe-frontend-port-forward.log 2>&1 &
          frontend_pid=$!
          $KUBECTL port-forward "service/${RELEASE}-api" "${api_port}:80" --namespace "$NAMESPACE" >/tmp/codecafe-api-port-forward.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$frontend_pid" "$api_pid" 2>/dev/null || true
            wait "$frontend_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            if curl --silent --fail "http://127.0.0.1:${frontend_port}/" >/dev/null && \
               curl --silent --fail "http://127.0.0.1:${api_port}/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done

          curl --fail "http://127.0.0.1:${frontend_port}/"
          curl --fail "http://127.0.0.1:${api_port}/health"
          REMOTE
