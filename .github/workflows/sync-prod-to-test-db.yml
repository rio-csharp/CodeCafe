name: Sync Production Database To Test

on:
  schedule:
    # Runs Monday 04:00 Asia/Shanghai.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "SYNC PROD TO TEST" to overwrite the test database.
        required: true

permissions:
  contents: read

env:
  PROD_DUMP_NAME: codecafe_prod_for_test_${{ github.run_id }}_${{ github.run_attempt }}.dump

jobs:
  sync:
    name: Sync production database to test
    runs-on: ubuntu-latest
    environment:
      name: test
    if: github.event_name == 'schedule' || inputs.confirm == 'SYNC PROD TO TEST'
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
            ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          {
            printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}"
            printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}"
          } > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Upload sync script
        run: |
          scp -P "${{ vars.TEST_SSH_PORT }}" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            scripts/ci/sync-prod-to-test-db.sh \
            "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:/tmp/sync-prod-to-test-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

      - name: Stream production dump to test server
        run: |
          set -euo pipefail
          ssh -p "${{ vars.PRODUCTION_SSH_PORT }}" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            "${{ vars.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "PGPASSFILE=/root/.pgpass pg_dump -h localhost -U codecafe -d codecafe -Fc" \
          | ssh -p "${{ vars.TEST_SSH_PORT }}" \
              -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
              -o StrictHostKeyChecking=yes \
              "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
              "cat > '/tmp/$PROD_DUMP_NAME' && test -s '/tmp/$PROD_DUMP_NAME'"

      - name: Restore test database
        run: |
          ssh -p "${{ vars.TEST_SSH_PORT }}" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "REMOTE_DUMP='/tmp/$PROD_DUMP_NAME' NAMESPACE='codecafe-test' RELEASE='codecafe-test' bash '/tmp/sync-prod-to-test-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh'; rm -f '/tmp/sync-prod-to-test-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh'"
