name: Deploy Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to deploy to test
        required: true
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  HELM_CHART: deploy/helm/codecafe
  NAMESPACE: codecafe-test
  RELEASE: codecafe-test
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set image tag
        run: echo "IMAGE_TAG=test-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build API artifact
        run: >
          dotnet publish backend/src/CodeCafe.Api/CodeCafe.Api.csproj
          --configuration Release
          --output .artifacts/api
          /p:UseAppHost=false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend artifact
        working-directory: frontend
        run: npm run build

      - name: Move frontend artifact
        run: |
          mkdir -p .artifacts/frontend
          cp -R frontend/dist/. .artifacts/frontend/

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/src/CodeCafe.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ env.IMAGE_TAG }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Deploy test environment
        run: |
          tar -czf codecafe-chart.tgz -C deploy/helm codecafe
          scp -P "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new codecafe-chart.tgz "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:/tmp/codecafe-chart.tgz"
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' TLS_SECRET='$TLS_SECRET' IMAGE_TAG='$IMAGE_TAG' TEST_FRONTEND_HOST='${{ secrets.TEST_FRONTEND_HOST }}' TEST_API_HOST='${{ secrets.TEST_API_HOST }}' REGISTRY='${{ env.REGISTRY }}' IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
          rm -rf /tmp/codecafe-chart
          mkdir -p /tmp/codecafe-chart
          tar -xzf /tmp/codecafe-chart.tgz -C /tmp/codecafe-chart
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          TLS_CERT_FILE="$(mktemp)"
          TLS_KEY_FILE="$(mktemp)"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.crt}' | base64 -d > "$TLS_CERT_FILE"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.key}' | base64 -d > "$TLS_KEY_FILE"
          kubectl create secret tls "$TLS_SECRET" \
            --cert="$TLS_CERT_FILE" \
            --key="$TLS_KEY_FILE" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$TLS_CERT_FILE" "$TLS_KEY_FILE"
          helm upgrade --install "$RELEASE" /tmp/codecafe-chart/codecafe \
            --namespace "$NAMESPACE" \
            --values /tmp/codecafe-chart/codecafe/values-test.yaml \
            --set frontend.image.repository="$REGISTRY/$IMAGE_NAMESPACE/frontend" \
            --set frontend.image.tag="$IMAGE_TAG" \
            --set api.image.repository="$REGISTRY/$IMAGE_NAMESPACE/api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set frontend.env.apiBaseUrl="https://$TEST_API_HOST" \
            --set frontend.ingress.host="$TEST_FRONTEND_HOST" \
            --set frontend.ingress.tls.secretName="$TLS_SECRET" \
            --set api.cors.allowedOrigins[0]="https://$TEST_FRONTEND_HOST" \
            --set api.ingress.host="$TEST_API_HOST" \
            --set api.ingress.tls.secretName="$TLS_SECRET"
          REMOTE

      - name: Wait for rollout
        run: |
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin; kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=frontend --namespace $NAMESPACE --timeout=180s && kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=api --namespace $NAMESPACE --timeout=180s"

      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 6 https://${{ secrets.TEST_FRONTEND_HOST }}
          curl --fail --retry 10 --retry-delay 6 https://${{ secrets.TEST_API_HOST }}/health
