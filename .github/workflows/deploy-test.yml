name: Deploy Test

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run id that produced artifacts.
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-test
  # Keep the current Helm deployment intact; GitHub keeps only the latest pending run.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE: codecafe-test
  RELEASE: codecafe-test
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve CI run
        id: ci
        uses: actions/github-script@v9
        env:
          DEPLOY_NAME: test
          DEPLOY_CI_RUN_ID: ${{ inputs.ci_run_id }}
          DEPLOY_REQUIRED_WORKFLOW_NAME: CI
          DEPLOY_ALLOWED_BRANCHES: 'release/**'
        with:
          script: |
            const resolveDeployCiRun = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/resolve-deploy-ci-run.js`);
            await resolveDeployCiRun({ github, context, core });

      - name: Download CI artifacts
        if: steps.ci.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts carry data only (Helm chart, deployment metadata). CD
          # scripts are never executed from the CI artifact; they are checked
          # out from the trusted (protected) release branch in the next step.
          mkdir -p .artifacts/helm .artifacts/deployment
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-helm-chart --dir .artifacts/helm
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-deployment --dir .artifacts/deployment

      - name: Checkout trusted CD scripts
        if: steps.ci.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          # The resolver validated that the CI run comes from a protected
          # release branch; deploy scripts run from a checkout of that branch
          # instead of the CI artifact.
          ref: ${{ steps.ci.outputs.head_branch }}
          path: .trusted

      - name: Set image tag
        if: steps.ci.outputs.skip != 'true'
        run: bash .trusted/scripts/cd/set-image-tag-env.sh

      - name: Prepare OAuth secret payload
        if: steps.ci.outputs.skip != 'true'
        env:
          OAUTH_CERT_BASE64: ${{ secrets.OAUTH_CERT_BASE64 }}
          OAUTH_CERT_PASSWORD: ${{ secrets.OAUTH_CERT_PASSWORD }}
        run: bash .trusted/scripts/cd/write-oauth-env.sh

      - name: Configure SSH
        if: steps.ci.outputs.skip != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0 (digest-pinned)
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        if: steps.ci.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy test environment
        if: steps.ci.outputs.skip != 'true'
        env:
          DEPLOY_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.TEST_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          FRONTEND_HOST: ${{ vars.TEST_FRONTEND_HOST }}
          API_HOST: ${{ vars.TEST_API_HOST }}
          DB_SECRET_NAMESPACE: ${{ env.NAMESPACE }}
          VALUES_FILE: values-test.yaml
          AI_ENABLED: 'true'
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          CD_SCRIPTS_DIR: .trusted/scripts/cd
        run: bash .trusted/scripts/cd/deploy-environment.sh
