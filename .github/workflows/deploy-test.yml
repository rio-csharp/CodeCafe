name: Deploy Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to deploy to test
        required: true
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  HELM_CHART: deploy/helm/codecafe
  NAMESPACE: codecafe-test
  RELEASE: codecafe-test
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Set image tag
        run: echo "IMAGE_TAG=test-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build API artifact
        run: >
          dotnet publish backend/src/CodeCafe.Api/CodeCafe.Api.csproj
          --configuration Release
          --output .artifacts/api
          /p:UseAppHost=false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend artifact
        working-directory: frontend
        run: npm run build

      - name: Move frontend artifact
        run: |
          mkdir -p .artifacts/frontend
          cp -R frontend/dist/. .artifacts/frontend/

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/src/CodeCafe.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ env.IMAGE_TAG }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Deploy test environment
        run: |
          CHART_ARCHIVE="codecafe-chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          REMOTE_DIR="/tmp/codecafe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$CHART_ARCHIVE" -C deploy/helm codecafe
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" "mkdir -p '$REMOTE_DIR'"
          scp -P "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "$CHART_ARCHIVE" "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/codecafe-chart.tgz"
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "REMOTE_DIR='$REMOTE_DIR' NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' TLS_SECRET='$TLS_SECRET' IMAGE_TAG='$IMAGE_TAG' TEST_FRONTEND_HOST='${{ secrets.TEST_FRONTEND_HOST }}' TEST_API_HOST='${{ secrets.TEST_API_HOST }}' REGISTRY='${{ env.REGISTRY }}' IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$REMOTE_DIR"' EXIT
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
          tar -xzf "$REMOTE_DIR/codecafe-chart.tgz" -C "$REMOTE_DIR"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          TLS_CERT_FILE="$(mktemp)"
          TLS_KEY_FILE="$(mktemp)"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.crt}' | base64 -d > "$TLS_CERT_FILE"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.key}' | base64 -d > "$TLS_KEY_FILE"
          kubectl create secret tls "$TLS_SECRET" \
            --cert="$TLS_CERT_FILE" \
            --key="$TLS_KEY_FILE" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$TLS_CERT_FILE" "$TLS_KEY_FILE"
          helm upgrade --install "$RELEASE" "$REMOTE_DIR/codecafe" \
            --namespace "$NAMESPACE" \
            --values "$REMOTE_DIR/codecafe/values-test.yaml" \
            --set frontend.image.repository="$REGISTRY/$IMAGE_NAMESPACE/frontend" \
            --set frontend.image.tag="$IMAGE_TAG" \
            --set api.image.repository="$REGISTRY/$IMAGE_NAMESPACE/api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set frontend.env.apiBaseUrl="https://$TEST_API_HOST" \
            --set frontend.ingress.host="$TEST_FRONTEND_HOST" \
            --set frontend.ingress.tls.secretName="$TLS_SECRET" \
            --set api.cors.allowedOrigins[0]="https://$TEST_FRONTEND_HOST" \
            --set api.ingress.host="$TEST_API_HOST" \
            --set api.ingress.tls.secretName="$TLS_SECRET"
          REMOTE

      - name: Wait for rollout
        run: |
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin; kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=frontend --namespace $NAMESPACE --timeout=180s && kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=api --namespace $NAMESPACE --timeout=180s"

      - name: Smoke test
        run: |
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin

          frontend_port=18080
          api_port=18081

          kubectl port-forward "service/${RELEASE}-frontend" "${frontend_port}:80" --namespace "$NAMESPACE" >/tmp/codecafe-frontend-port-forward.log 2>&1 &
          frontend_pid=$!
          kubectl port-forward "service/${RELEASE}-api" "${api_port}:80" --namespace "$NAMESPACE" >/tmp/codecafe-api-port-forward.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$frontend_pid" "$api_pid" 2>/dev/null || true
            wait "$frontend_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            if curl --silent --fail "http://127.0.0.1:${frontend_port}/" >/dev/null && \
               curl --silent --fail "http://127.0.0.1:${api_port}/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done

          curl --fail "http://127.0.0.1:${frontend_port}/"
          curl --fail "http://127.0.0.1:${api_port}/health"
          REMOTE
