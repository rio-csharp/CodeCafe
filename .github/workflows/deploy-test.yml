name: Deploy Test

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run id that produced artifacts.
        required: true

permissions:
  actions: read
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE: codecafe-test
  RELEASE: codecafe-test
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Resolve CI run
        id: ci
        uses: actions/github-script@v9
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            const run = context.payload.workflow_run;

            if (!isDispatch) {
              if (run.conclusion !== 'success' || run.event !== 'push' || !run.head_branch?.startsWith('release/')) {
                core.setOutput('skip', 'true');
                return;
              }
            }

            core.setOutput('skip', 'false');
            core.setOutput('ci_run_id', isDispatch ? '${{ inputs.ci_run_id }}' : String(run.id));

      - name: Download CI artifacts
        if: steps.ci.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/helm .artifacts/deployment
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-ci-scripts --dir .artifacts/scripts
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-helm-chart --dir .artifacts/helm
          gh run download "${{ steps.ci.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-deployment --dir .artifacts/deployment

      - name: Set image tag
        if: steps.ci.outputs.skip != 'true'
        run: |
          . .artifacts/deployment/deployment.env
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Prepare OAuth secret payload
        if: steps.ci.outputs.skip != 'true'
        env:
          OAUTH_CERT_BASE64: ${{ secrets.OAUTH_CERT_BASE64 }}
          OAUTH_CERT_PASSWORD: ${{ secrets.OAUTH_CERT_PASSWORD }}
        run: |
          umask 077
          {
            printf 'OAUTH_CERT_BASE64=%q\n' "$OAUTH_CERT_BASE64"
            printf 'OAUTH_CERT_PASSWORD=%q\n' "$OAUTH_CERT_PASSWORD"
          } > .artifacts/deployment/oauth.env

      - name: Configure SSH
        if: steps.ci.outputs.skip != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        if: steps.ci.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy test environment
        if: steps.ci.outputs.skip != 'true'
        run: |
          CHART_ARCHIVE="codecafe-chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          REMOTE_DIR="/tmp/codecafe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$CHART_ARCHIVE" -C .artifacts/helm .
          ssh -p "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" "mkdir -p '$REMOTE_DIR/codecafe'"
          scp -P "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "$CHART_ARCHIVE" "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/codecafe-chart.tgz"
          scp -P "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes ".artifacts/scripts/deploy-helm.sh" "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/deploy-helm.sh"
          scp -P "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes ".artifacts/deployment/oauth.env" "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/oauth.env"
          ssh -p "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "REMOTE_DIR='$REMOTE_DIR' NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' TLS_SECRET='$TLS_SECRET' IMAGE_TAG='$IMAGE_TAG' FRONTEND_HOST='${{ vars.TEST_FRONTEND_HOST }}' API_HOST='${{ vars.TEST_API_HOST }}' REGISTRY='${{ env.REGISTRY }}' IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' DB_SECRET_NAMESPACE='$NAMESPACE' VALUES_FILE='values-test.yaml' OAUTH_ENV_FILE='$REMOTE_DIR/oauth.env' bash '$REMOTE_DIR/deploy-helm.sh'"
