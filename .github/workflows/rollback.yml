name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional Helm revision to roll back to. Leave empty to roll back one revision.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NAMESPACE: codecafe-prod
  RELEASE: codecafe-prod

jobs:
  rollback:
    name: Rollback production environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0 (digest-pinned)
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Roll back production environment
        env:
          REVISION: ${{ inputs.revision }}
          ROLLBACK_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          ROLLBACK_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          ROLLBACK_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          FRONTEND_HOST: ${{ vars.PRODUCTION_FRONTEND_HOST }}
          API_HOST: ${{ vars.PRODUCTION_API_HOST }}
          KUBECTL_BIN: sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl
          HELM_BIN: sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/helm
        run: bash scripts/cd/rollback-environment.sh
