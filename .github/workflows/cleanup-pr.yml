name: Cleanup PR Preview

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose preview namespace should be deleted.
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete PR namespace
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Delete preview namespace
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          ssh -p "${{ vars.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "kubectl delete namespace codecafe-pr-$PR_NUMBER --ignore-not-found=true"
