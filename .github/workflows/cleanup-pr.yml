name: Cleanup PR Preview

on:
  pull_request:
    branches:
      - release/**
    types:
      - closed
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose preview namespace should be deleted.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    name: Delete PR namespace
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Delete preview namespace
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: bash scripts/maintenance/delete-pr-preview-namespace.sh

  cleanup-stale:
    name: Delete stale PR namespaces
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Delete namespaces for closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: bash scripts/maintenance/delete-stale-pr-preview-namespaces.sh
