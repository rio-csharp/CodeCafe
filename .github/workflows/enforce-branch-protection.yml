name: Enforce Branch Merge Rules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  enforce-main-source:
    name: Enforce release-only merge to main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_BRANCH:-}" ]; then
            echo "SOURCE_BRANCH is required."
            exit 1
          fi

          if [ -z "${SOURCE_REPOSITORY:-}" ] || [ -z "${TARGET_REPOSITORY:-}" ]; then
            echo "SOURCE_REPOSITORY and TARGET_REPOSITORY are required."
            exit 1
          fi

          source_branch="$SOURCE_BRANCH"
          source_repository="$SOURCE_REPOSITORY"
          target_repository="$TARGET_REPOSITORY"

          echo "Source branch: $source_branch"
          echo "Source repository: $source_repository"

          if [[ "$source_branch" == release/* && "$source_repository" == "$target_repository" ]]; then
            echo "Source branch is a release branch from this repository. Merge to main is allowed."
            exit 0
          fi

          echo "Only branches matching 'release/*' from '$target_repository' are allowed to merge into main."
          echo "Source '$source_repository:$source_branch' is not allowed."
          exit 1
