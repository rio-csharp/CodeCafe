name: Enforce Branch Merge Rules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  enforce-main-source:
    name: Enforce release-only merge to main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          source_branch="${{ github.head_ref }}"
          echo "Source branch: $source_branch"
          if [[ "$source_branch" == release/* ]]; then
            echo "✅ Source branch is a release branch. Merge to main is allowed."
            exit 0
          else
            echo "❌ Only branches matching 'release/*' are allowed to merge into main."
            echo "Source branch '$source_branch' is not allowed."
            exit 1
          fi
