name: Deploy PR Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy.
        required: true
      ci_run_id:
        description: CI workflow run id that produced artifacts.
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE_PREFIX: codecafe-pr
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    environment:
      name: test
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isDispatch = context.eventName === 'workflow_dispatch';
            const run = context.payload.workflow_run;

            if (!isDispatch) {
              if (run.conclusion !== 'success' || run.event !== 'pull_request') {
                core.setOutput('skip', 'true');
                return;
              }
            }

            let prNumber = isDispatch ? Number('${{ inputs.pr_number }}') : run.pull_requests?.[0]?.number;

            if (!prNumber && run?.head_sha) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              prNumber = associated.data.find(pr => pr.base.ref.startsWith('release/'))?.number;
            }

            if (!prNumber) {
              core.setOutput('skip', 'true');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open' || !pr.base.ref.startsWith('release/')) {
              core.setOutput('skip', 'true');
              return;
            }

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.warning('Skipping preview deploy for forked PR to avoid exposing deployment secrets.');
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('ci_run_id', isDispatch ? '${{ inputs.ci_run_id }}' : String(run.id));

      - name: Download CI artifacts
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/helm .artifacts/deployment .artifacts/scripts
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-ci-scripts --dir .artifacts/scripts
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-helm-chart --dir .artifacts/helm
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-deployment --dir .artifacts/deployment

      - name: Set deployment variables
        if: steps.pr.outputs.skip != 'true'
        run: |
          . .artifacts/deployment/deployment.env
          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "NAMESPACE=${{ env.NAMESPACE_PREFIX }}-${{ steps.pr.outputs.pr_number }}"
            echo "RELEASE=codecafe-pr-${{ steps.pr.outputs.pr_number }}"
            echo "FRONTEND_HOST=pr-${{ steps.pr.outputs.pr_number }}.${{ vars.PREVIEW_BASE_DOMAIN }}"
            echo "API_HOST=api-pr-${{ steps.pr.outputs.pr_number }}.${{ vars.PREVIEW_BASE_DOMAIN }}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        if: steps.pr.outputs.skip != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        if: steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy preview
        if: steps.pr.outputs.skip != 'true'
        run: |
          CHART_ARCHIVE="codecafe-chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          REMOTE_DIR="/tmp/codecafe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$CHART_ARCHIVE" -C .artifacts/helm .
          ssh -p "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" "mkdir -p '$REMOTE_DIR/codecafe'"
          scp -P "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "$CHART_ARCHIVE" "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/codecafe-chart.tgz"
          scp -P "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes ".artifacts/scripts/deploy-helm.sh" "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/deploy-helm.sh"
          ssh -p "${{ vars.TEST_SSH_PORT }}" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "${{ vars.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "REMOTE_DIR='$REMOTE_DIR' NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' TLS_SECRET='${{ env.TLS_SECRET }}' IMAGE_TAG='$IMAGE_TAG' FRONTEND_HOST='$FRONTEND_HOST' API_HOST='$API_HOST' REGISTRY='${{ env.REGISTRY }}' IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' DB_SECRET_NAMESPACE='codecafe-test' FRONTEND_REPLICA_COUNT='1' API_REPLICA_COUNT='1' API_MIGRATION_ENABLED='false' bash '$REMOTE_DIR/deploy-helm.sh'"

      - name: Comment preview
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- codecafe-pr-preview -->';
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}');
            const body = `${marker}
            ## PR Preview

            | Service | URL |
            | --- | --- |
            | Frontend | \`https://${process.env.FRONTEND_HOST}\` |
            | API readiness | \`https://${process.env.API_HOST}/health/ready\` |

            Namespace: \`${process.env.NAMESPACE}\`
            Image tag: \`${process.env.IMAGE_TAG}\`
            `;

            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.data.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
