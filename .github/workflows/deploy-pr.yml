name: Deploy PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number used for namespace and host names.
        required: true
      image_tag:
        description: Existing image tag to deploy.
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  HELM_CHART: deploy/helm/codecafe

jobs:
  deploy:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set deployment variables
        run: |
          echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=codecafe-pr-${{ inputs.pr_number }}" >> "$GITHUB_ENV"
          echo "RELEASE=codecafe-pr-${{ inputs.pr_number }}" >> "$GITHUB_ENV"
          echo "FRONTEND_HOST=pr-${{ inputs.pr_number }}.${{ vars.PREVIEW_BASE_DOMAIN }}" >> "$GITHUB_ENV"
          echo "API_HOST=api-pr-${{ inputs.pr_number }}.${{ vars.PREVIEW_BASE_DOMAIN }}" >> "$GITHUB_ENV"
          echo "TLS_SECRET=codecafe-test-wildcard-tls" >> "$GITHUB_ENV"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Deploy preview
        run: |
          CHART_ARCHIVE="codecafe-chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          REMOTE_DIR="/tmp/codecafe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$CHART_ARCHIVE" -C deploy/helm codecafe
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" "mkdir -p '$REMOTE_DIR'"
          scp -P "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "$CHART_ARCHIVE" "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:$REMOTE_DIR/codecafe-chart.tgz"
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "REMOTE_DIR='$REMOTE_DIR' NAMESPACE='$NAMESPACE' RELEASE='$RELEASE' TLS_SECRET='$TLS_SECRET' IMAGE_TAG='$IMAGE_TAG' FRONTEND_HOST='$FRONTEND_HOST' API_HOST='$API_HOST' REGISTRY='${{ env.REGISTRY }}' IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$REMOTE_DIR"' EXIT
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
          tar -xzf "$REMOTE_DIR/codecafe-chart.tgz" -C "$REMOTE_DIR"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          TLS_CERT_FILE="$(mktemp)"
          TLS_KEY_FILE="$(mktemp)"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.crt}' | base64 -d > "$TLS_CERT_FILE"
          kubectl get secret "$TLS_SECRET" --namespace codecafe-shared -o jsonpath='{.data.tls\.key}' | base64 -d > "$TLS_KEY_FILE"
          kubectl create secret tls "$TLS_SECRET" \
            --cert="$TLS_CERT_FILE" \
            --key="$TLS_KEY_FILE" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$TLS_CERT_FILE" "$TLS_KEY_FILE"
          helm upgrade --install "$RELEASE" "$REMOTE_DIR/codecafe" \
            --namespace "$NAMESPACE" \
            --set frontend.replicaCount=1 \
            --set frontend.image.repository="$REGISTRY/$IMAGE_NAMESPACE/frontend" \
            --set frontend.image.tag="$IMAGE_TAG" \
            --set api.replicaCount=1 \
            --set api.image.repository="$REGISTRY/$IMAGE_NAMESPACE/api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set frontend.env.apiBaseUrl="https://$API_HOST" \
            --set frontend.ingress.host="$FRONTEND_HOST" \
            --set frontend.ingress.tls.secretName="$TLS_SECRET" \
            --set api.cors.allowedOrigins[0]="https://$FRONTEND_HOST" \
            --set api.ingress.host="$API_HOST" \
            --set api.ingress.tls.secretName="$TLS_SECRET"
          REMOTE

      - name: Wait for rollout
        run: |
          ssh -p "${{ secrets.TEST_SSH_PORT }}" -o StrictHostKeyChecking=accept-new "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" \
            "export PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin; kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=frontend --namespace $NAMESPACE --timeout=180s && kubectl rollout status deployment --selector app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=api --namespace $NAMESPACE --timeout=180s"

      - name: Summarize preview
        run: |
          {
            echo "## PR Preview"
            echo
            echo "| Service | URL |"
            echo "| --- | --- |"
            echo "| Frontend | \`https://$FRONTEND_HOST\` |"
            echo "| API health | \`https://$API_HOST/health\` |"
            echo
            echo "Namespace: \`$NAMESPACE\`"
            echo "Image tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- codecafe-pr-preview -->';
            const prNumber = Number('${{ inputs.pr_number }}');
            const frontendHost = process.env.FRONTEND_HOST;
            const apiHost = process.env.API_HOST;
            const body = `${marker}
            ## PR Preview

            | Service | URL |
            | --- | --- |
            | Frontend | \`https://${frontendHost}\` |
            | API health | \`https://${apiHost}/health\` |

            Namespace: \`${process.env.NAMESPACE}\`
            Image tag: \`${process.env.IMAGE_TAG}\`
            `;

            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
