name: Deploy PR Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - 'feature/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy.
        required: true
      ci_run_id:
        description: CI workflow run id that produced artifacts.
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read  # TEMP: testing whether write is required for the comment step (see ad501b4)

concurrency:
  group: deploy-pr-preview-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE_PREFIX: codecafe-pr
  TLS_SECRET: codecafe-test-wildcard-tls

jobs:
  deploy:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    environment:
      name: test
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve PR
        id: pr
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          PREVIEW_CI_RUN_ID: ${{ inputs.ci_run_id }}
          PREVIEW_REQUIRED_WORKFLOW_NAME: CI
        with:
          script: |
            const resolvePrPreview = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/resolve-pr-preview.js`);
            await resolvePrPreview({ github, context, core });

      - name: Download CI artifacts
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/helm .artifacts/deployment .artifacts/scripts
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-cd-scripts --dir .artifacts/scripts
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-helm-chart --dir .artifacts/helm
          gh run download "${{ steps.pr.outputs.ci_run_id }}" --repo "${{ github.repository }}" --name codecafe-deployment --dir .artifacts/deployment

      - name: Set deployment variables
        if: steps.pr.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
        run: bash scripts/github/set-pr-preview-env.sh

      - name: Prepare OAuth secret payload
        if: steps.pr.outputs.skip != 'true'
        env:
          OAUTH_CERT_BASE64: ${{ secrets.OAUTH_CERT_BASE64 }}
          OAUTH_CERT_PASSWORD: ${{ secrets.OAUTH_CERT_PASSWORD }}
        run: bash .artifacts/scripts/write-oauth-env.sh

      - name: Configure SSH
        if: steps.pr.outputs.skip != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        if: steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Verify preview is still needed
        id: predeploy
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PREVIEW_EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const verifyPrPreviewCurrent = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/verify-pr-preview-current.js`);
            await verifyPrPreviewCurrent({ github, context, core });

      - name: Deploy preview
        if: steps.predeploy.outputs.current == 'true'
        env:
          DEPLOY_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.TEST_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          DB_SECRET_NAMESPACE: codecafe-test
          FRONTEND_REPLICA_COUNT: '1'
          API_REPLICA_COUNT: '1'
          API_MIGRATION_ENABLED: 'false'
        run: bash .artifacts/scripts/deploy-environment.sh

      - name: Verify deployed preview is still current
        id: postdeploy
        if: steps.predeploy.outputs.current == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PREVIEW_EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const verifyPrPreviewCurrent = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/verify-pr-preview-current.js`);
            await verifyPrPreviewCurrent({ github, context, core });

      - name: Delete stale deployed preview
        if: steps.predeploy.outputs.current == 'true' && steps.postdeploy.outputs.current != 'true'
        env:
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: bash .artifacts/scripts/delete-stale-pr-preview.sh

      - name: Comment preview
        if: steps.postdeploy.outputs.current == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        with:
          script: |
            const commentPrPreview = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/comment-pr-preview.js`);
            await commentPrPreview({ github, context, core });
